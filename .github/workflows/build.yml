name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Python and Flet
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Build APK
        run: yes | flet build apk --product "Every Penny" --org "com.param.everypenny"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: potty-savings-apk
          path: build/apk/**/*.apk
